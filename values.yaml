# Microspell - Opinionated Microservice Deployment Chart
# Built on top of Summon with additional microservice-specific features

# Microservice identity
name: ""

# Container image configuration
image:
  repository: ""
  name: ""
  tag: ""
  pullPolicy: IfNotPresent

# Environment variables - simplified configuration
envs: {}

# Infrastructure features
infrastructure:
  prolicy:
    enabled: false  # Enable Vault policy creation
    # serviceAccount: custom-sa  # Custom service account for Vault

# ============================================
# DataStore - PostgreSQL Integration
# ============================================
dataStore:
  psql:
    enabled: false

    # ==========================================
    # Cluster Selection / Creation
    # ==========================================
    # IF selector is empty → MANAGED (creates new CNPG cluster)
    # IF selector has values → EXTERNAL (uses existing cluster via runicIndexer)
    selector: {}
    # environment: production
    # tier: shared

    # Cluster name (managed only)
    # Default: {service-name}-pg
    clusterName: ""

    # ==========================================
    # Database Configuration
    # ==========================================
    database: ""     # Database name (default: service name)
    username: ""     # Database username (default: service name)

    # ==========================================
    # Cluster Configuration (managed only)
    # Ignored when selector exists
    # ==========================================
    cluster:
      instances: 1

      image: {}
      # repository: ""
      # name: ""
      # tag: ""

      storage:
        size: 10Gi
        storageClass: ""

      resources: {}
      # limits:
      #   cpu: 2000m
      #   memory: 4Gi
      # requests:
      #   cpu: 500m
      #   memory: 1Gi

      # Advanced CNPG options
      startDelay: ""       # Default: 3600
      stopDelay: ""        # Default: 1800
      primaryUpdateStrategy: ""

      # Managed roles
      roles: []
      # - name: readonly
      #   login: true

      # PostgreSQL configuration
      postgresql: {}
      # parameters:
      #   max_connections: "200"
      #   shared_buffers: "2GB"

      # Affinity rules
      affinity: {}

    # ==========================================
    # Database Initialization
    # ==========================================
    # Behavior:
    # - NO selector (managed): postInitApp (bootstrap SQL)
    # - WITH selector (external): Job (schema migration)
    initDb:
      enabled: false

      # SQL to execute
      sql: ""
      # sql: |
      #   CREATE EXTENSION IF NOT EXISTS pg_trgm;
      #   CREATE TABLE IF NOT EXISTS users (id SERIAL PRIMARY KEY);

      # Or reference ConfigMap
      configMap:
        name: ""
        key: init.sql

      # Job configuration (external clusters only)
      job:
        image:
          repository: postgres
          tag: "16-alpine"
        backoffLimit: 3
        restartPolicy: OnFailure

    # ==========================================
    # Credentials Configuration
    # ==========================================
    # Behavior:
    # - NO selector (managed): Static superuser + Dynamic app credentials
    # - WITH selector (external): Dynamic credentials only
    credentials:
      # Dynamic credentials configuration
      dynamic:
        role: read-write  # read-write | read-only
        ttl: ""           # "" = infinite (default 30m), "1h" = 1 hour, etc.

      # Superuser configuration (managed only)
      superuser:
        enabled: true
        name: ""  # Default: {service-name}-pg-superuser
        secretType: kubernetes.io/basic-auth
        vaultSelector: {}

    # ==========================================
    # Connection Configuration
    # ==========================================
    connection:
      # Connection string format
      format: dsn  # dsn | url | separate

      # DSN format string (when format=dsn or url)
      # Variables: {host}, {port}, {database}, {username}, {password}
      dsnTemplate: "postgresql://{username}:{password}@{host}:{port}/{database}"

      # Environment variable names
      envNames:
        # When format=dsn or url (single env var)
        dsn: DATABASE_URL

        # When format=separate (multiple env vars)
        host: DB_HOST
        port: DB_PORT
        database: DB_NAME
        username: DB_USER
        password: DB_PASSWORD

      # Host pattern (for managed clusters)
      # Variables: {clusterName}
      # Available: {clusterName}-rw, {clusterName}-ro, {clusterName}-r
      host: "{clusterName}-rw"

      # Port
      port: 5432

      # SSL mode
      sslMode: disable  # disable | require | verify-ca | verify-full

      # Additional connection parameters
      params: {}
      # connect_timeout: 10
      # application_name: myapp

# Secrets use summon's local/create contract or a glyph location such as vault.
secrets: {}
# # Existing Kubernetes Secret mounted as a file
# tls-cert:
#   location: local
#   contentType: file
#   mountPath: /etc/tls
#   name: tls.crt
#
# # Create a Kubernetes Secret
# api-key:
#   location: create
#   contentType: file
#   mountPath: /etc/api
#   name: api-key
#   content: "sk_live_xyz123"
#
# # Read a Vault secret through the vault glyph
# db-credentials:
#   location: vault
#   path: chapter
#   format: env
#   keys:
#     - username
#     - password

# Service configuration with advanced networking
service:
  enabled: true
  type: ClusterIP  # ClusterIP, NodePort, LoadBalancer
  annotations: {}
  # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  labels: {}

  ports: []
  # - port: 80
  #   targetPort: 8080
  #   protocol: TCP
  #   name: http
  # - port: 9090
  #   targetPort: 9090
  #   protocol: TCP
  #   name: metrics

  # Istio/Service Mesh features
  circuitBreaking:
    enabled: false
    maxRequestsPerConnection: 10
    http1MaxPendingRequests: 10
    maxConnections: 10
    consecutive5xxErrors: 5
    interval: 30s
    baseEjectionTime: 3m
    maxEjectionPercent: 100

  retry:
    enabled: false
    attempts: 3
    perTryTimeout: "10s"
    retryOn: "5xx,reset,connect-failure,refused-stream"

  # URL path configuration
  rewrite: /  # Rewrite incoming paths
  prefix: ""  # URL prefix, defaults to service name
  timeout: 30s  # Request timeout

  # Service discovery
  subdomain: ""  # For headless services
  external: false  # Expose via external gateway

